 if(!report){report={id:`S${state.season}-mid`,season:state.season,type:'mid',events:[],note:'Transferred V01.002 progress; earlier automated deals remain in the history.'};state.windows.push(report);}
 return report;
}
function closeMidWindow(){if(midStatus()!=='open')return null;
 // Deadline-day business is completed BEFORE the first match of Round 9.
 const deadline=transfers('deadline');state.midStatus='closed';save();return deadline;
}
function windowName(type){return type==='mid'?'MID-SEASON':type==='deadline'?'DEADLINE DAY':type==='pre'?'PRE-SEASON':'LEGACY SAVE';}
function transfers(type){
 const events=[],season=state.season;
 // A transfer chain moves players with the same positional role around different clubs.
 for(const group of ['DEF','MID','ST','GK']){
  const chance=type==='mid'?.29:type==='deadline'?.16:.48;
  const choices=state.clubs.map(c=>({club:c,slots:c.squad.map((p,i)=>({p,i})).filter(x=>positionGroup(x.p.pos)===group&&!isLocked(x.p)&&x.p.suspended===0)})).filter(x=>x.slots.length&&Math.random()<chance);
  if(choices.length<2)continue;
  choices.sort(()=>Math.random()-.5);
  const selected=choices.map(x=>({...x,slot:x.slots[Math.floor(Math.random()*x.slots.length)]}));
  const outgoing=selected.map(x=>x.slot.p);
  selected.forEach((x,i)=>{
   const source=selected[(i-1+selected.length)%selected.length];
   const arrival=outgoing[(i-1+outgoing.length)%outgoing.length];
   x.club.squad[x.slot.i]=arrival;
   events.push({type:'transfer',player:arrival.name,from:source.club.name,to:x.club.name});
  });
 }
 // Clubs may delist an unprotected player and replace the slot with a signing.
 for(const c of state.clubs){
  if(Math.random()>(type==='mid'?.34:type==='deadline'?.17:.67))continue;
  const eligible=c.squad.map((p,i)=>({p,i})).filter(x=>x.i>=11&&!isLocked(x.p));
  if(!eligible.length)continue;
  const slot=eligible[Math.floor(Math.random()*eligible.length)];
  const released=slot.p;
  c.squad.splice(slot.i,1);
  state.freeAgents.push({player:released,former:c.id});
  events.push({type:'delisted',player:released.name,from:c.name,to:'Free agents'});
  const possible=state.freeAgents.map((x,i)=>({...x,i})).filter(x=>x.player.pos===released.pos&&x.former!==c.id);
  const pick=possible.length&&Math.random()<.52?possible[Math.floor(Math.random()*possible.length)]:null;
  const signed=pick?state.freeAgents.splice(pick.i,1)[0].player:genPlayer(released.pos);
  c.squad.splice(slot.i,0,signed);
  events.push({type:'signing',player:signed.name,from:pick?'Free agents':'New talent',to:c.name});
 }
 const report={id:`S${season}-${type}`,season,type,events};state.windows.push(report);
 if(type==='mid'){state.midDone=true;state.midStatus='open';}
 state.latestWindow=report.id;save();return report;
}
function maybeMidWindow(){if(midStatus()==='pending'&&firstHalfDone())return transfers('mid');return null;}
function selectLineup(c){
 const selected=[],used=new Set(),suspended=c.squad.filter(p=>p.suspended>0);
 POS.forEach((pos,i)=>{
  const starter=c.squad[i];if(starter&&!starter.suspended&&!used.has(starter.uid)){selected.push(starter);used.add(starter.uid);return;}
  const replacement=c.squad.find(p=>!p.suspended&&!used.has(p.uid)&&positionGroup(p.pos)===positionGroup(pos))||c.squad.find(p=>!p.suspended&&!used.has(p.uid));
  if(replacement){selected.push(replacement);used.add(replacement.uid);}
 });
 return {players:selected,suspended};
}
function pickWeighted(players){
 const weights=players.map(p=>({GK:.08,DEF:.43,MID:1.17,ST:2.3}[positionGroup(p.pos)]||.7));
 let n=Math.random()*weights.reduce((a,b)=>a+b,0);
 for(let i=0;i<players.length;i++){n-=weights[i];if(n<=0)return players[i];}
 return players[players.length-1];
}
function makeCards(team,lineup){
 const cards=[],teamPlayers=lineup.players;
 let n=Math.min(randPoisson(team.id%2?.95:1.35)+Math.floor(Math.random()*2),5);
 const available=teamPlayers.filter(p=>p.pos!=='GK');
 for(let j=0;j<n;j++){
  if(!available.length)break;
  const player=available[Math.floor(Math.random()*available.length)];
  if(cards.some(e=>e.uid===player.uid))continue;
  cards.push({minute:6+Math.floor(Math.random()*77),team:team.id,uid:player.uid,player:player.name,type:'yellow'});
 }
 if(Math.random()<.095){
  const existing=cards.filter(e=>e.type==='yellow');
  if(existing.length&&Math.random()<.53){const first=existing[Math.floor(Math.random()*existing.length)],minute=first.minute+3+Math.floor(Math.random()*(88-first.minute-3));cards.push({minute,team:team.id,uid:first.uid,player:first.player,type:'second-yellow'});}
  else if(teamPlayers.length){const player=teamPlayers[Math.floor(Math.random()*teamPlayers.length)];cards.push({minute:15+Math.floor(Math.random()*75),team:team.id,uid:player.uid,player:player.name,type:'red'});}
 }
 return cards.sort((a,b)=>a.minute-b.minute);
}
function disciplinaryUpdate(c,lineup,cards){
 // Suspensions served by players who could not take part in this fixture.
 lineup.suspended.forEach(p=>{p.suspended=Math.max(0,p.suspended-1);});
 cards.forEach(e=>{const p=c.squad.find(x=>x.uid===e.uid);if(!p)return;
  if(e.type==='yellow'||e.type==='second-yellow'){p.seasonYellows++;p.yellowCycle++;if(p.yellowCycle>=5){p.suspended=Math.max(p.suspended,1);p.yellowCycle=0;}}
  if(e.type==='red'||e.type==='second-yellow'){p.seasonReds++;p.suspended=Math.max(p.suspended,e.type==='red'?2:1);}
 });
}

function fixturesFor(ids,div){const rounds=[],a=ids.slice();for(let r=0;r<7;r++){const matches=[];for(let j=0;j<4;j++){let h=a[j],w=a[7-j];if((r+j)%2){[h,w]=[w,h]}matches.push({id:`S${state.season}D${div}R${r+1}M${j}`,division:div,round:r+1,home:h,away:w,result:null});}rounds.push(matches);a.splice(1,0,a.pop());}for(let r=0;r<7;r++)rounds.push(rounds[r].map((m,j)=>({id:`S${state.season}D${div}R${r+8}M${j}`,division:div,round:r+8,home:m.away,away:m.home,result:null})));return rounds.flat();}
function buildFixtures(){state.fixtures=[1,2,3].flatMap(d=>fixturesFor(divclubs(d).map(c=>c.id),d));}
function fresh(){state={version:VERSION,season:1,clubs:INITIAL.map((c,id)=>({id,name:c[0],short:c[1],division:c[2],strength:c[3],status:c[4],squad:makeSquad(id)})),fixtures:[],history:[],windows:[],midDone:false,midStatus:'pending',freeAgents:[],nextPlayerId:10000,settings:{protectCustom:true},latestWindow:null};buildFixtures();save();}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){console.warn('Local storage unavailable',e)}}
function validSave(saved){return saved&&['V01.000','V01.001','V01.002','V01.003'].includes(saved.version)&&Array.isArray(saved.clubs)&&saved.clubs.length===24&&Array.isArray(saved.fixtures)&&saved.fixtures.length===168;}
function load(){try{
 let saved=JSON.parse(localStorage.getItem(SAVE_KEY));
 if(validSave(saved)){if(saved.version==='V01.000')saved._importedOld=true;normalise(saved);save();return;}
 for(const key of PREVIOUS_SAVE_KEYS){
  saved=JSON.parse(localStorage.getItem(key));
  if(validSave(saved)){if(saved.version==='V01.000')saved._importedOld=true;normalise(saved);save();return;}
 }
 }catch(e){console.warn('Could not load previous save',e)}fresh();}
function matches(d=null,r=null){return state.fixtures.filter(f=>(d===null||f.division===d)&&(r===null||f.round===r));}
function allDone(){return state.fixtures.every(f=>f.result);}
function nextRound(d){return Array.from({length:14},(_,i)=>i+1).find(r=>matches(d,r).some(f=>!f.result))||14;}
function randPoisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<11);return Math.min(k-1,8)}
function scorer(players,minute,cards){const excluded=new Set(cards.filter(c=>(c.type==='red'||c.type==='second-yellow')&&c.minute<minute).map(c=>c.uid));const eligible=players.filter(p=>!excluded.has(p.uid));return pickWeighted(eligible.length?eligible:players)||{name:'Unknown scorer',uid:null};}
function simulate(f){
 if(f.result)return true;
 if(f.round>7){
   if(!firstHalfDone()){alert('Finish Round 7 in ALL THREE divisions to open the market before Round 8.');return false;}
   maybeMidWindow();
 }
 if(f.round>=9){
   if(!eighthRoundDone()){alert('Transfer deadline: complete Round 8 in ALL THREE divisions before starting Round 9. The market remains open meanwhile.');return false;}
   if(midStatus()==='open')closeMidWindow();
 }
 const a=club(f.home),b=club(f.away),la=selectLineup(a),lb=selectLineup(b);
 const ca=makeCards(a,la),cb=makeCards(b,lb),cards=ca.concat(cb).sort((x,y)=>x.minute-y.minute);
 let hBase=1.22+(a.strength-b.strength)*.034+.28, aBase=1.15+(b.strength-a.strength)*.034;
 const homeRed=ca.filter(c=>['red','second-yellow'].includes(c.type)),awayRed=cb.filter(c=>['red','second-yellow'].includes(c.type));
 homeRed.forEach(e=>{hBase*=1-.36*(90-e.minute)/90; aBase*=1+.17*(90-e.minute)/90;});
 awayRed.forEach(e=>{aBase*=1-.36*(90-e.minute)/90; hBase*=1+.17*(90-e.minute)/90;});
 hBase=Math.max(.18,Math.min(3.2,hBase));aBase=Math.max(.18,Math.min(3.0,aBase));
 const h=randPoisson(hBase),w=randPoisson(aBase),goals=[];
 for(let i=0;i<h;i++){const minute=1+Math.floor(Math.random()*90),p=scorer(la.players,minute,ca);goals.push({minute,team:a.id,scorer:p.name,uid:p.uid});}
 for(let i=0;i<w;i++){const minute=1+Math.floor(Math.random()*90),p=scorer(lb.players,minute,cb);goals.push({minute,team:b.id,scorer:p.name,uid:p.uid});}
 goals.sort((x,y)=>x.minute-y.minute||x.team-y.team);
 disciplinaryUpdate(a,la,ca);disciplinaryUpdate(b,lb,cb);
 f.result={home:h,away:w,htHome:goals.filter(g=>g.team===a.id&&g.minute<=45).length,htAway:goals.filter(g=>g.team===b.id&&g.minute<=45).length,goals,cards,homeYellow:ca.filter(x=>x.type!=='red').length,awayYellow:cb.filter(x=>x.type!=='red').length,homeRed:homeRed.length,awayRed:awayRed.length};
 maybeMidWindow();save();return true;
}
function simulateRound(d,r){for(const f of matches(d,r))if(!simulate(f))break;save();}
function simulateSeason(){for(let round=1;round<=14;round++)for(let division=1;division<=3;division++)for(const f of matches(division,round))if(!simulate(f))return;save();}
function records(d){const all=divclubs(d).map(c=>({id:c.id,name:c.name,p:0,w:0,draw:0,l:0,gf:0,ga:0,pts:0,form:[]}));const map=new Map(all.map(o=>[o.id,o]));matches(d).filter(f=>f.result).sort((a,b)=>a.round-b.round).forEach(f=>{let a=map.get(f.home),b=map.get(f.away),h=f.result.home,v=f.result.away;a.p++;b.p++;a.gf+=h;a.ga+=v;b.gf+=v;b.ga+=h;if(h>v){a.w++;b.l++;a.pts+=3;a.form.push('W');b.form.push('L')}else if(h<v){b.w++;a.l++;b.pts+=3;b.form.push('W');a.form.push('L')}else{a.draw++;b.draw++;a.pts++;b.pts++;a.form.push('D');b.form.push('D')}});all.forEach(t=>{t.gd=t.gf-t.ga;t.form=t.form.slice(-5)});return all.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));}
function scorers(d=null){const m=new Map();matches(d).forEach(f=>{if(!f.result)return;f.result.goals.forEach(g=>{const key=g.uid||g.team+'|'+g.scorer;const v=m.get(key)||{team:g.team,name:g.scorer,goals:0};v.goals++;v.team=g.team;m.set(key,v);});});return [...m.values()].sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));}
function nextSeason(){
 if(!allDone()){alert('Complete every match before starting the next season.');return;}
 let table=[null,records(1),records(2),records(3)];
 const summary={season:state.season,champions:table.slice(1).map((t,i)=>({division:i+1,club:t[0].id,points:t[0].pts})),promoted:[table[2][0].id,table[3][0].id],relegated:[table[1][7].id,table[2][7].id],goldenBoot:scorers().slice(0,3),results:state.fixtures.map(f=>({division:f.division,round:f.round,home:f.home,away:f.away,result:f.result}))};
 state.history.push(summary);
 club(table[1][7].id).division=2;club(table[2][0].id).division=1;club(table[2][7].id).division=3;club(table[3][0].id).division=2;
 state.season++;
 state.clubs.forEach(c=>c.squad.forEach(p=>{p.seasonYellows=0;p.seasonReds=0;p.yellowCycle=0;p.suspended=0;}));
 state.midDone=false;state.midStatus='pending';
 const preseason=transfers('pre');buildFixtures();ui.round=1;ui.division=1;ui.page='transfers';save();render();
 showWindow(preseason.id);
}
function changePage(p){ui.page=p;if(p==='fixtures')ui.round=nextRound(ui.division);render();window.scrollTo({top:0,behavior:'smooth'});}
function changeDivision(d){ui.division=+d;ui.round=nextRound(ui.division);render();}
function capLabel(c){return c.status==='reserved'?'<span style="color:var(--gold);font-size:10px"> · INVITATION RESERVED</span>':''}
function hero(){const played=state.fixtures.filter(f=>f.result).length;return `<section class="hero"><div><div class="eyebrow">PFL SPORTS MANAGEMENT PRESENTS</div><h1>4-FOUR-<span>2</span></h1><p>Twenty-four clubs. Three divisions. One promotion place. Every goal writes history.</p></div></section><div class="stats"><div class="stat"><div class="big">${String(state.season).padStart(2,'0')}</div><div class="small">Season</div></div><div class="stat"><div class="big">${played}<span style="font-size:16px;color:#90a99b"> /168</span></div><div class="small">Matches played</div></div><div class="stat"><div class="big">${state.fixtures.reduce((n,f)=>n+(f.result?f.result.home+f.result.away:0),0)}</div><div class="small">Goals scored</div></div><div class="stat"><div class="big">${state.history.length}</div><div class="small">Seasons archived</div></div></div>`;}
function table(d){const rs=records(d),done=matches(d).every(f=>f.result);return `<table class="ladder"><thead><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th class="hide-xs">Form</th></tr></thead><tbody>${rs.map((r,i)=>`<tr class="${i===0&&d>1?'promote':''} ${i===7&&d<3?'relegate':''}"><td>${i+1}</td><td title="${esc(r.name)}">${esc(r.name)}${i===0&&d===1&&done?' 🏆':''}${i===0&&d>1?' <span style="color:var(--lime)">↑</span>':''}${i===7&&d<3?' <span style="color:var(--red)">↓</span>':''}</td><td>${r.p}</td><td>${r.w}</td><td>${r.draw}</td><td>${r.l}</td><td>${r.gd>0?'+':''}${r.gd}</td><td style="font-weight:900;color:var(--lime)">${r.pts}</td><td class="hide-xs"><div class="formline">${r.form.map(s=>`<span class="formdot ${s}">${s}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table><p class="smallnote" style="margin-top:13px">${d===1?'🏆 1st: champions · 🔻 8th: relegated':d===2?'🟢 1st: promoted · 🔻 8th: relegated':'🟢 1st: promoted · no relegation'}${!done?' · Provisional standings':''}</p>`;}
function fixtureLine(f){const a=club(f.home),b=club(f.away),r=f.result;return `<div class="fixture"><div class="team">${esc(a.short)}${capLabel(a)}</div><div style="text-align:center"><div class="scoreline">${r?`${r.home}<span style="color:#557b62">:</span>${r.away}`:'<span class="not">VS</span>'}</div>${r?`<div class="tag ht">HT ${r.htHome}-${r.htAway}</div><div class="tag">🟨 ${(r.homeYellow||0)}:${(r.awayYellow||0)} · 🟥 ${(r.homeRed||0)}:${(r.awayRed||0)}</div>`:''}</div><div class="team right">${esc(b.short)}${capLabel(b)}</div><button class="${r?'detail':''}" onclick="${r?`openReport('${f.id}')`:`simOne('${f.id}')`}">${r?'REPORT':'PLAY ▶'}</button></div>`;}

function leaderBox(d){const s=scorers(d).slice(0,5);return `<div class="leaders">${s.length?s.map((p,i)=>`<div class="leader"><div><div style="font-weight:900;font-size:12px">${i+1}. ${esc(p.name)}</div><small>${esc(club(p.team).short)}</small></div><span class="goals">${p.goals}</span></div>`).join(''):'<div class="empty">No goals yet. Kick off the season!</div>'}</div>`;}

function fixtures(){const fs=matches(ui.division,ui.round),played=matches(ui.division).filter(f=>f.result).length;return `<div class="toolbar"><div><h2 class="section-title">FIXTURES & RESULTS</h2><p class="hint">Season ${state.season} · ${played}/56 matches finished in Division ${ui.division}</p></div>${tabs()}</div><div class="panel fixturepage"><div class="panel-head"><div class="roundnav"><button class="btn alt tiny" onclick="setRound(${Math.max(1,ui.round-1)})" ${ui.round===1?'disabled':''}>← PREV</button><span class="roundnum">ROUND ${ui.round}</span><button class="btn alt tiny" onclick="setRound(${Math.min(14,ui.round+1)})" ${ui.round===14?'disabled':''}>NEXT →</button></div><select class="select" style="max-width:150px" onchange="setRound(+this.value)">${Array.from({length:14},(_,i)=>`<option value="${i+1}" ${ui.round===i+1?'selected':''}>Matchday ${i+1}</option>`).join('')}</select></div>${fs.map(fixtureLine).join('')}<div class="actions" style="margin-top:18px"><button class="btn" onclick="simRound(${ui.division},${ui.round})" ${fs.every(f=>f.result)?'disabled':''}>SIMULATE ROUND ▶</button><button class="btn alt" onclick="simDivision(${ui.division})" ${matches(ui.division).every(f=>f.result)?'disabled':''}>FINISH DIVISION</button></div></div><div class="notice">Home and away, 14 rounds per division. Click <b>PLAY</b> to simulate an individual match or <b>REPORT</b> for the full-time scoreboard and every goal minute. Matchdays 1–7 must be completed across all divisions before Matchday 8. The transfer window opens at the end of Round 7, stays open through Round 8, and closes before Round 9.</div>`;}

function togglePlayerLock(clubId,uid){

 if(!p)return;

function marketSet(field,value){ui[field]=['marketFrom','marketTo','marketClub'].includes(field)?Number(value):value;
 if(field==='marketFrom'||field==='marketTo'){
   // Keep the selling and destination clubs distinct, including when a selector changes.
   if(ui.marketFrom===ui.marketTo){
     if(field==='marketFrom')ui.marketTo=state.clubs.find(c=>c.id!==ui.marketFrom).id;
     else ui.marketFrom=state.clubs.find(c=>c.id!==ui.marketTo).id;
   }
   ui.marketPlayer='';ui.marketSwap='';
 }
 if(field==='marketPlayer')ui.marketSwap='';
 if(field==='marketClub'){ui.marketBench='';ui.marketRecruit='';}

 render();
}

function manualTransferDesk(){
 const from=club(ui.marketFrom??0)||state.clubs[0];
 const to=(club(ui.marketTo??1)!==from?club(ui.marketTo??1):null)||state.clubs.find(c=>c!==from);
 const eligible=from.squad.filter(p=>!isLocked(p)&&p.suspended===0);
 const outbound=eligible.find(p=>p.uid===ui.marketPlayer)||eligible[0];
 const counterparts=outbound?to.squad.filter(p=>p.pos===outbound.pos&&!isLocked(p)&&p.suspended===0):[];

 const recruitClub=club(ui.marketClub??0)||state.clubs[0];
 const reserves=recruitClub.squad.slice(11).filter(p=>!isLocked(p));
 const released=reserves.find(p=>p.uid===ui.marketBench)||reserves[0];
 const candidates=released?state.freeAgents.filter(x=>x.player.pos===released.pos&&x.former!==recruitClub.id):[];
 const selectedRecruit=candidates.some(x=>x.player.uid===ui.marketRecruit)?ui.marketRecruit:'new';
 return `<div class="toolbar"><h2 class="section-title">GENERAL MANAGER'S DESK</h2><span class="window-open-pill">🟢 OPEN UNTIL ROUND 9</span></div><div class="market-grid"><div class="panel"><div class="eyebrow">MANUAL TRANSFERS</div><h2 style="margin:9px 0 5px">Player Exchange</h2><p class="sub" style="margin-bottom:18px">Swap one unlocked player for another in the same position. Both clubs keep a full 16-player squad.</p><div class="market-form"><label class="field">SELLING CLUB<select class="select" onchange="marketSet('marketFrom',this.value)">${marketOptions(state.clubs,from.id)}</select></label><label class="field">PLAYER AVAILABLE FOR TRANSFER<select class="select" onchange="marketSet('marketPlayer',this.value)" ${!outbound?'disabled':''}>${marketSquadOptions(eligible,outbound?.uid)||'<option>No unlocked players</option>'}</select></label><label class="field">DESTINATION CLUB<select class="select" onchange="marketSet('marketTo',this.value)">${marketOptions(state.clubs.filter(c=>c.id!==from.id),to.id)}</select></label><label class="field">PLAYER COMING IN EXCHANGE<select class="select" onchange="marketSet('marketSwap',this.value)" ${!exchange?'disabled':''}>${marketSquadOptions(counterparts,exchange?.uid)||'<option>No matching unlocked player</option>'}</select></label><button class="btn" onclick="completeExchange()" ${!exchange?'disabled':''}>CONFIRM TRANSFER ⇄</button></div></div><div class="panel"><div class="eyebrow">SQUAD REBUILD</div><h2 style="margin:9px 0 5px">Delist & Sign</h2><p class="sub" style="margin-bottom:18px">Release an unlocked reserve and sign a free agent or generate new talent in the same position.</p><div class="market-form"><label class="field">CLUB<select class="select" onchange="marketSet('marketClub',this.value)">${marketOptions(state.clubs,recruitClub.id)}</select></label><label class="field">UNLOCKED RESERVE TO DELIST<select class="select" onchange="marketSet('marketBench',this.value)" ${!released?'disabled':''}>${marketSquadOptions(reserves,released?.uid)||'<option>All reserves protected</option>'}</select></label><label class="field">REPLACEMENT PLAYER<select class="select" onchange="marketSet('marketRecruit',this.value)" ${!released?'disabled':''}><option value="new" ${selectedRecruit==='new'?'selected':''}>✦ New signing · Academy player</option>${candidates.map(x=>`<option value="${esc(x.player.uid)}" ${x.player.uid===selectedRecruit?'selected':''}>${esc(x.player.name)} · Free agent</option>`).join('')}</select></label><button class="btn" onclick="completeSigning()" ${!released?'disabled':''}>CONFIRM DELISTING + SIGNING ✦</button></div></div></div><p class="notice" style="margin:15px 0">🔒 Locked players are unavailable for both manual and automatic moves. Visit CLUB HQ to change individual padlocks before the Round 9 deadline.</p>`;
}
function completeExchange(){
 if(midStatus()!=='open')return alert('The mid-season transfer market is closed.');
 const from=club(ui.marketFrom??0)||state.clubs[0],to=club(ui.marketTo??1)||state.clubs[1];
 if(!from||!to||from.id===to.id)return alert('Choose two different clubs.');
 const available=from.squad.filter(p=>!isLocked(p)&&p.suspended===0),player=available.find(p=>p.uid===ui.marketPlayer)||available[0];
 const others=player?to.squad.filter(p=>p.pos===player.pos&&!isLocked(p)&&p.suspended===0):[];
 const incoming=others.find(p=>p.uid===ui.marketSwap)||others[0];
 if(!player||!incoming)return alert('Both players must be unlocked, available, and play the same position.');
 if(!confirm(`Transfer ${player.name} to ${to.name} in exchange for ${incoming.name}? Both players will change clubs.`))return;
 const i=from.squad.findIndex(p=>p.uid===player.uid),j=to.squad.findIndex(p=>p.uid===incoming.uid);
 if(i<0||j<0)return alert('A selected player is no longer available. Refresh the desk.');
 from.squad[i]=incoming;to.squad[j]=player;
 midReport().events.push({type:'transfer',player:player.name,from:from.name,to:to.name,manual:true},{type:'transfer',player:incoming.name,from:to.name,to:from.name,manual:true});
 ui.marketPlayer='';ui.marketSwap='';save();render();alert('Transfer completed! Both clubs retain 16 players.');
}
function completeSigning(){
 if(midStatus()!=='open')return alert('The mid-season transfer market is closed.');
 const c=club(ui.marketClub??0)||state.clubs[0];
 const reserves=c.squad.slice(11).filter(p=>!isLocked(p));
 const outgoing=reserves.find(p=>p.uid===ui.marketBench)||reserves[0];
 if(!outgoing)return alert('No eligible unlocked reserve at this club.');
 const free=state.freeAgents.find(x=>x.player.uid===ui.marketRecruit&&x.player.pos===outgoing.pos&&x.former!==c.id);
 const replacement=free?.player||genPlayer(outgoing.pos);
 if(!confirm(`Delist ${outgoing.name} from ${c.name} and sign ${replacement.name}?`))return;
 const index=c.squad.findIndex(p=>p.uid===outgoing.uid);if(index<11)return alert('Only reserve players may be delisted.');
 if(free)state.freeAgents.splice(state.freeAgents.indexOf(free),1);
 c.squad[index]=replacement;state.freeAgents.push({player:outgoing,former:c.id});
 midReport().events.push({type:'delisted',player:outgoing.name,from:c.name,to:'Free agents',manual:true},{type:'signing',player:replacement.name,from:free?'Free agents':'New talent',to:c.name,manual:true});
 ui.marketBench='';ui.marketRecruit='';save();render();alert('Squad updated! The delisted player is now a free agent.');
}

style="margin-top:12px" onclick="showWindow('${w.id}')">ALL ${w.events.length} MOVES →</button>`:''}`:'<p class="sub">No player moves in this report.</p>'}</div>`).join(''):'<div class="panel"><div class="empty">The market opens after Round 7.<br>Transfer history will appear here automatically.</div></div>'}<p class="smallnote" style="margin-top:16px">${state.clubs.reduce((n,c)=>n+c.squad.filter(isLocked).length,0)} protected players league-wide. Use individual padlocks in Club HQ to protect your stars.</p>`;

function openReport(id){const f=state.fixtures.find(x=>x.id===id);if(!f||!f.result)return;const a=club(f.home),b=club(f.away),r=f.result;
 const events=[...r.goals.map(g=>({...g,type:'goal'})),...(r.cards||[]).map(c=>({...c,type:c.type})),{minute:45.5,type:'half'},{minute:90.5,type:'ft'}].sort((x,y)=>x.minute-y.minute);
 $('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Match report"><div class="modal-head"><div class="eyebrow">MATCH REPORT · S${state.season} · DIV ${f.division} · ROUND ${f.round}</div><button onclick="closeModal()">CLOSE ✕</button></div><div class="report-cover"><div class="eyebrow">PFL SPORTS · FINAL WHISTLE</div><div class="clubs"><div class="clubname">${esc(a.name)}</div><div class="score">${r.home}<span style="color:#749780">:</span>${r.away}</div><div class="clubname">${esc(b.name)}</div></div><div class="halftime">HALF TIME · ${r.htHome} – ${r.htAway}</div><div class="card-stats"><span>🟨 ${r.homeYellow||0} – ${r.awayYellow||0}</span><span>🟥 ${r.homeRed||0} – ${r.awayRed||0}</span></div><div class="smallnote" style="margin-top:12px">FULL TIME · 90 MINUTES</div></div><div class="toolbar"><h2 class="section-title">MATCH TIMELINE</h2><span class="version">${r.goals.length} GOALS · ${(r.cards||[]).length} CARDS</span></div><div class="timeline">${events.map(e=>e.type==='half'?`<div class="event half"><div class="min">HT</div><div><div class="who">HALF TIME · ${r.htHome}–${r.htAway}</div><div class="detail">45 minutes played</div></div></div>`:e.type==='ft'?`<div class="event ft"><div class="min">FT</div><div><div class="who">FULL TIME · ${r.home}–${r.away}</div><div class="detail">The final whistle</div></div></div>`:e.type==='goal'?`<div class="event"><div class="min">${e.minute}'</div><div><div class="who">⚽ ${esc(e.scorer)}</div><div class="detail">${esc(club(e.team).name)} · GOAL</div></div></div>`:`<div class="event card-${e.type}"><div class="min">${e.minute}'</div><div><div class="who">${e.type==='red'?'🟥':e.type==='second-yellow'?'🟨🟥':'🟨'} ${esc(e.player)}</div><div class="detail">${esc(club(e.team).name)} · ${e.type==='red'?'STRAIGHT RED':e.type==='second-yellow'?'SECOND YELLOW · SENT OFF':'YELLOW CARD'}</div></div></div>`).join('')}</div>${r.goals.length===0?'<p class="notice" style="margin-top:12px">A hard-fought 0–0 draw. Neither side found the back of the net.</p>':''}<div class="actions" style="margin-top:20px"><button class="btn alt" onclick="closeModal()">← RETURN TO MATCH CENTRE</button></div></div></div>`;}
function closeModal(){$('overlay').innerHTML='';if(ui.pendingWindow){const id=ui.pendingWindow;ui.pendingWindow=null;showWindow(id);}}
function selectClub(id){ui.club=id;render()}
function draftClubName(s){} // Edits are committed on change, protecting active match reports.
function saveClubName(s){const c=club(ui.club);s=s.trim();if(!s){alert('Enter a club name.');render();return;}c.name=s;save();render()}
function saveShort(s){const c=club(ui.club);s=s.trim();if(!s){alert('Enter a short club name.');render();return;}c.short=s;save();render()}
function savePlayer(id,index,s,input){const c=club(id);s=s.trim();if(!s){alert('Enter a player name.');render();return;}
 const p=c.squad[index];p.name=s;p.custom=true;save();
 if(input&&typeof input.closest==='function'){
  const row=input.closest('.player-row'),btn=row&&row.querySelector('.roster-lock');
  if(btn){const locked=isLocked(p);row.classList.toggle('protected',locked);btn.classList.toggle('locked',locked);btn.classList.toggle('open',!locked);btn.setAttribute('aria-pressed',String(locked));btn.setAttribute('aria-label',(locked?'Unlock ':'Lock ')+p.name+' for transfers');btn.title=locked?'Protected — click to allow transfers':'Available — click to prevent transfers and delistings';btn.innerHTML=lockIcon(locked)+'<span>'+(locked?'LOCKED':'OPEN')+'</span>';}
 }
}
function randomizeSquad(id){if(!confirm('Replace all 16 player names with new fictional footballers? This clears all name protection and individual padlocks for the club.'))return;const c=club(id);c.squad.forEach(p=>{p.name=FIRST[Math.floor(Math.random()*FIRST.length)]+' '+LAST[Math.floor(Math.random()*LAST.length)];p.custom=false;p.transferLock=null;});save();render();}
function acceptInvite(id){const c=club(id);if(c.status!=='reserved')return;if(!confirm(`Confirm ${c.name} has accepted its invitation?`))return;c.status='accepted';save();render()}
function showArchived(season){const h=state.history.find(x=>x.season===season);if(!h)return;const summary=[1,2,3].map(d=>`<div style="margin-top:15px"><h2>DIVISION ${d}</h2>${h.results.filter(r=>r.division===d).map(f=>`<div class="fixture" style="grid-template-columns:minmax(0,1fr) 55px minmax(0,1fr)"><span class="team">${esc(club(f.home).short)}</span><span style="font:900 23px 'Barlow Condensed';text-align:center">${f.result.home}–${f.result.away}</span><span class="team right">${esc(club(f.away).short)}</span></div>`).join('')}</div>`).join('');$('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>SEASON ${h.season} · ARCHIVE</h2><button onclick="closeModal()">CLOSE ✕</button></div><p class="sub">All ${h.results.length} final scores. The archive retains the original match results.</p>${summary}</div></div>`;}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`PFL_4-FOUR-2_${VERSION}_Season_${state.season}_Backup.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importSave(file){if(!file)return;try{const incoming=JSON.parse(await file.text());if(!['V01.000','V01.001','V01.002','V01.003'].includes(incoming.version)||!Array.isArray(incoming.clubs)||incoming.clubs.length!==24||!Array.isArray(incoming.fixtures)||incoming.fixtures.length!==168||!Array.isArray(incoming.history))throw Error('Not a compatible V01.000–V01.003 backup.');if(!confirm('Replace this game with the uploaded backup? Export your current game first if you want to keep it.'))return;const legacy=incoming.version==='V01.000';if(legacy)incoming._importedOld=true;normalise(incoming);save();ui={page:'home',division:1,round:1,club:0};render();alert(legacy?'V01.000 save upgraded. Your existing results and club names are preserved.':'Backup restored successfully.')}catch(e){alert('Could not import backup: '+e.message)}}
function resetAll(){if(!confirm('DANGER: Delete your current 4-FOUR-2 save? You will lose ALL results, names and history unless you exported a backup.'))return;if(!confirm('FINAL CONFIRMATION: Start a brand-new Season 1?'))return;fresh();ui={page:'home',division:1,round:1,club:0};render()}
load();render();
</script></body></html>
